name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: stable
          - os: ubuntu-latest
            go: oldstable
          # Go 1.13 is the compatibility floor, not a security-supported release.
          - os: ubuntu-latest
            go: '1.13.15'
          - os: windows-latest
            go: stable
          - os: macos-latest
            go: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          # No module dependencies; Go 1.13 also predates GOMODCACHE.
          cache: false
      - run: go version
      - name: Test
        run: go test -v ./...

  quality:
    name: Format, vet, race, coverage, and fuzz smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test with race detection and coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Report coverage
        run: go tool cover -func=coverage.out
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 14
      - name: Fuzz decryption (30 seconds)
        run: go test -run='^$' -fuzz='^FuzzDecrypt$' -fuzztime=30s -parallel=2 ./...
      - name: Fuzz round trips (30 seconds)
        run: go test -run='^$' -fuzz='^FuzzRoundTrip$' -fuzztime=30s -parallel=2 ./...
      - name: Upload failing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures-smoke
          path: testdata/fuzz
          if-no-files-found: ignore
          retention-days: 14
